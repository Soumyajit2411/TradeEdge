name: Deploy

on:
  push:
    branches: [master]

# Required GitHub secrets:
#
# VERCEL_TOKEN        — Vercel personal access token (vercel.com → Settings → Tokens)
# VERCEL_ORG_ID       — from .vercel/project.json after running `vercel link` locally
# VERCEL_PROJECT_ID   — from .vercel/project.json after running `vercel link` locally
#
# RENDER_API_KEY      — Render API key (dashboard → Account Settings → API Keys)
# RENDER_SERVICE_ID   — Render service ID, looks like srv-xxxxxxxx (from service URL)

jobs:
  # ── Frontend → Vercel ────────────────────────────────────────────────────────
  deploy-frontend:
    name: Frontend → Vercel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ── Backend → Render ─────────────────────────────────────────────────────────
  deploy-backend:
    name: Backend → Render
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deploy
        run: |
          response=$(curl -s -o /tmp/render_response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -d '{"clearCache": false}')
          echo "HTTP $response"
          cat /tmp/render_response.json
          [ "$response" -eq 201 ] || exit 1
