name: Deploy

on:
  push:
    branches: [master]

jobs:
  # ── 1. Deploy REST APIs → Google Cloud Run ────────────────────────────────
  deploy-cloudrun:
    name: Cloud Run (REST APIs)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/tradiary/api:${{ github.sha }} \
            backend/
          docker push \
            ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/tradiary/api:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy tradiary-api \
            --image ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/tradiary/api:${{ github.sha }} \
            --region ${{ secrets.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --timeout 120 \
            --memory 512Mi \
            --set-env-vars "\
          SUPABASE_URL=${{ secrets.SUPABASE_URL }},\
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }},\
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }},\
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},\
          GEMINI_MODEL=${{ secrets.GEMINI_MODEL }},\
          DELTA_EXCHANGE_BASE_URL=${{ secrets.DELTA_EXCHANGE_BASE_URL }},\
          DELTA_EXCHANGE_API_KEY=${{ secrets.DELTA_EXCHANGE_API_KEY }},\
          DELTA_EXCHANGE_API_SECRET=${{ secrets.DELTA_EXCHANGE_API_SECRET }},\
          REDIS_URL=${{ secrets.REDIS_URL }},\
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }},\
          EMAIL_FROM=${{ secrets.EMAIL_FROM }},\
          EMAIL_TO=${{ secrets.EMAIL_TO }},\
          CORS_ALLOW_ORIGIN=${{ secrets.CORS_ALLOW_ORIGIN }}"

  # ── 2. Deploy WebSocket + Realtime + Scheduler → Oracle VPS ──────────────
  deploy-oracle:
    name: Oracle VPS (WebSocket + Realtime + Scheduler)
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd ~/tradiary
            git pull origin master
            cd backend
            docker compose up -d --build
